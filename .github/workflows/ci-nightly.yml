name: CI Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # macos-15 default Xcode is still 16.4; app floor is iOS 26 → need Xcode 26.x SDK.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install tools
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Nightly property tests
        run: |
          xcodebuild \
            -scheme HotBod \
            -testPlan HotBod \
            -only-test-configuration Nightly \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.0' \
            -enableCodeCoverage YES \
            -quiet \
            test
        env:
          PROPERTY_ITERATIONS: "500"

      - name: Deno backend tests
        run: |
          brew install deno
          deno test --allow-env --allow-net supabase/functions/
